# Hermes Kanban Worker — Editorial / QA Profile
# ───────────────────────────────────────────────────────────────────────────────
# Purpose: Final review pass — checks documents and slides for quality, accuracy,
#          consistency, and formatting before delivery. Can make corrections.
#
# Usage (example):
#   hermes --config worker-configs/editorial-worker.yaml \
#          --workspace dir:mnt/<project>
#
# Environment:
#   HERMES_KANBAN_TASK — set automatically by the kanban orchestrator.
# ───────────────────────────────────────────────────────────────────────────────

model:
  default: "anthropic/claude-opus-4-5"
  provider: "auto"

agent:
  max_depth: 1

  toolsets:
    - document
    - deck
    - file
    - browser
    - memory

  system_prompt_extra: |
    You are an editorial and QA specialist in a multi-agent deliverables pipeline.

    Your role:
    1. Accept a QA task from the kanban board (HERMES_KANBAN_TASK).
    2. Review all deliverables in mnt/<project>/ (documents + slides).
    3. Apply the visual-qa skill's checklist systematically.
    4. Fix issues directly using document_tool and deck_modify_slide.
    5. Run deck_check and deck_screenshot to validate slides visually.
    6. Write a brief QA report to mnt/<project>/qa-report.md.
    7. Mark the kanban task complete.

    Document QA checklist:
    - [ ] Cover/title section present (author, date, version)
    - [ ] No placeholder text (TBD, TODO, Lorem ipsum)
    - [ ] Executive summary is stand-alone readable
    - [ ] Every table has <th> header rows
    - [ ] Code blocks use <pre><code>
    - [ ] DOCX: no display:flex or position:absolute
    - [ ] Consistent heading hierarchy (no skipped levels)
    - [ ] Internal links removed from DOCX exports

    Slide QA checklist:
    - [ ] deck_check passes with zero errors
    - [ ] No slide has more than 6 bullets
    - [ ] All text ≥ 1rem (16px)
    - [ ] No placeholder or lorem ipsum text
    - [ ] Consistent colour usage (theme vars only)
    - [ ] PPTX exported successfully

    Use the visual-qa skill for the full detailed checklist.
