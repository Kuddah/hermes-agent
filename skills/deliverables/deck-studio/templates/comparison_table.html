<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280,height=720">
  <link rel="stylesheet" href="../_theme.css">
</head>
<body class="slide">
<div class="slide-wrapper" style="
  display:flex; flex-direction:column;
  padding: 52px 70px;
  background: var(--color-bg);
">
  <h2 style="
    color: var(--color-primary);
    font-family: var(--font-heading);
    font-size: 1.9rem;
    font-weight: 700;
    margin: 0 0 28px;
  ">Comparison</h2>

  <table style="
    border-collapse: collapse;
    width: 100%;
    font-family: var(--font-body);
    font-size: 0.95rem;
  ">
    <thead>
      <tr>
        <th style="background:var(--color-surface);color:var(--color-muted);
            font-weight:600;text-align:left;padding:12px 16px;border:1px solid #30363d;
            width:35%;">Feature</th>
        <th style="background:var(--color-primary);color:#fff;
            font-weight:700;text-align:center;padding:12px 16px;border:1px solid #30363d;">
          Our Product
        </th>
        <th style="background:var(--color-surface);color:var(--color-muted);
            font-weight:600;text-align:center;padding:12px 16px;border:1px solid #30363d;">
          Competitor A
        </th>
        <th style="background:var(--color-surface);color:var(--color-muted);
            font-weight:600;text-align:center;padding:12px 16px;border:1px solid #30363d;">
          Competitor B
        </th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td style="color:var(--color-text);padding:11px 16px;border:1px solid #30363d;">Feature Name</td>
        <td style="text-align:center;padding:11px 16px;border:1px solid #30363d;color:#3fb950;font-weight:700;">✓</td>
        <td style="text-align:center;padding:11px 16px;border:1px solid #30363d;color:#f85149;">✗</td>
        <td style="text-align:center;padding:11px 16px;border:1px solid #30363d;color:var(--color-muted);">Partial</td>
      </tr>
      <tr>
        <td style="color:var(--color-text);padding:11px 16px;border:1px solid #30363d;background:#0d1117;">Feature Name</td>
        <td style="text-align:center;padding:11px 16px;border:1px solid #30363d;background:#0d1117;color:#3fb950;font-weight:700;">✓</td>
        <td style="text-align:center;padding:11px 16px;border:1px solid #30363d;background:#0d1117;color:#3fb950;font-weight:700;">✓</td>
        <td style="text-align:center;padding:11px 16px;border:1px solid #30363d;background:#0d1117;color:#f85149;">✗</td>
      </tr>
      <tr>
        <td style="color:var(--color-text);padding:11px 16px;border:1px solid #30363d;">Feature Name</td>
        <td style="text-align:center;padding:11px 16px;border:1px solid #30363d;color:#3fb950;font-weight:700;">✓</td>
        <td style="text-align:center;padding:11px 16px;border:1px solid #30363d;color:#f85149;">✗</td>
        <td style="text-align:center;padding:11px 16px;border:1px solid #30363d;color:#f85149;">✗</td>
      </tr>
      <tr>
        <td style="color:var(--color-text);padding:11px 16px;border:1px solid #30363d;background:#0d1117;">Feature Name</td>
        <td style="text-align:center;padding:11px 16px;border:1px solid #30363d;background:#0d1117;color:#3fb950;font-weight:700;">✓</td>
        <td style="text-align:center;padding:11px 16px;border:1px solid #30363d;background:#0d1117;color:var(--color-muted);">Partial</td>
        <td style="text-align:center;padding:11px 16px;border:1px solid #30363d;background:#0d1117;color:var(--color-muted);">Partial</td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
