<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280,height=720">
  <link rel="stylesheet" href="../_theme.css">
</head>
<body class="slide">
<div class="slide-wrapper" style="
  display:flex; flex-direction:column;
  justify-content:center; align-items:center; text-align:center;
  background: var(--color-primary);
  padding: 80px;
">
  <p style="
    color: rgba(255,255,255,0.6);
    font-family: var(--font-heading);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin: 0 0 20px;
  ">SECTION 02</p>

  <h1 style="
    color: #ffffff;
    font-family: var(--font-heading);
    font-size: 3rem;
    font-weight: 700;
    line-height: 1.2;
    margin: 0 0 20px;
    max-width: 800px;
  ">Section Title</h1>

  <p style="
    color: rgba(255,255,255,0.7);
    font-family: var(--font-body);
    font-size: 1.1rem;
    margin: 0;
    max-width: 600px;
  ">One line that sets context for what follows in this section.</p>
</div>
</body>
</html>
