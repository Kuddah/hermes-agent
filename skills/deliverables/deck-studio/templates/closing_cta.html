<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280,height=720">
  <link rel="stylesheet" href="../_theme.css">
</head>
<body class="slide">
<div class="slide-wrapper" style="
  display:flex; flex-direction:column;
  justify-content:center; align-items:center; text-align:center;
  background: linear-gradient(135deg, var(--color-surface) 0%, var(--color-bg) 100%);
  padding: 80px;
">
  <h2 style="
    color: var(--color-text);
    font-family: var(--font-heading);
    font-size: 2.8rem;
    font-weight: 700;
    margin: 0 0 24px;
  ">Thank You</h2>

  <p style="
    color: var(--color-muted);
    font-family: var(--font-body);
    font-size: 1.15rem;
    max-width: 640px;
    line-height: 1.75;
    margin: 0 0 44px;
  ">Supporting statement or closing thought. Keep it short and memorable.</p>

  <!-- CTA button — remove if not needed -->
  <div style="
    background: var(--color-primary);
    color: #ffffff;
    font-family: var(--font-heading);
    font-size: 1rem;
    font-weight: 600;
    padding: 16px 40px;
    border-radius: 8px;
    margin-bottom: 48px;
  ">Get Started →</div>

  <!-- Contact details -->
  <div style="
    display:flex; gap:40px; align-items:center;
    color: var(--color-muted); font-size: 0.9rem;
    font-family: var(--font-body);
  ">
    <span>presenter@company.com</span>
    <span style="color:var(--color-primary);">·</span>
    <span>company.com</span>
    <span style="color:var(--color-primary);">·</span>
    <span>@handle</span>
  </div>
</div>
</body>
</html>
