<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280,height=720">
  <link rel="stylesheet" href="../_theme.css">
</head>
<body class="slide">
<div class="slide-wrapper" style="
  display:flex; flex-direction:column;
  padding: 52px 70px;
  background: var(--color-bg);
">
  <h2 style="
    color: var(--color-primary);
    font-family: var(--font-heading);
    font-size: 1.9rem;
    font-weight: 700;
    margin: 0 0 32px;
  ">Slide Heading</h2>

  <div style="display:flex; gap:40px; flex:1; align-items:center;">
    <!-- Text panel (left) -->
    <div style="flex:1; display:flex; flex-direction:column; gap:16px;">
      <p style="
        color: var(--color-text);
        font-family: var(--font-body);
        font-size: 1.05rem;
        line-height: 1.75;
        margin: 0;
      ">
        Supporting text for the image on the right. Keep this concise — the
        image should do most of the communicating. One to three short paragraphs
        or a bulleted list works well.
      </p>
      <ul style="
        color: var(--color-muted);
        font-family: var(--font-body);
        font-size: 1rem;
        line-height: 1.8;
        margin: 0;
        padding-left: 1.25rem;
      ">
        <li>Supporting point one</li>
        <li>Supporting point two</li>
        <li>Supporting point three</li>
      </ul>
    </div>

    <!-- Image panel (right) -->
    <div style="
      flex:1;
      background: var(--color-surface);
      border-radius: 12px;
      overflow: hidden;
      min-height: 380px;
      display:flex; align-items:center; justify-content:center;
    ">
      <!-- Replace src with an absolute image URL or base64 data: URI -->
      <img
        src="https://via.placeholder.com/560x380/161b22/58a6ff?text=Image"
        alt="Descriptive alt text"
        style="width:100%; height:100%; object-fit:cover;"
      >
    </div>
  </div>
</div>
</body>
</html>
