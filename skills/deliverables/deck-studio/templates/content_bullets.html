<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280,height=720">
  <link rel="stylesheet" href="../_theme.css">
</head>
<body class="slide">
<div class="slide-wrapper" style="
  display:flex; flex-direction:column;
  padding: 60px 80px;
  background: var(--color-bg);
">
  <h2 style="
    color: var(--color-primary);
    font-family: var(--font-heading);
    font-size: 2rem;
    font-weight: 700;
    margin: 0 0 36px;
    border-bottom: 2px solid var(--color-surface);
    padding-bottom: 16px;
  ">Slide Heading</h2>

  <ul style="
    color: var(--color-text);
    font-family: var(--font-body);
    font-size: 1.15rem;
    line-height: 1.9;
    margin: 0;
    padding-left: 1.5rem;
  ">
    <li>Key point one — keep to one sentence, one idea</li>
    <li>Key point two — supporting detail if needed</li>
    <li>Key point three — avoid more than 6 bullets</li>
    <li>Key point four</li>
    <li>Key point five — keep reading effort low</li>
  </ul>

  <!-- Optional: footnote / source line -->
  <p style="
    margin-top: auto;
    color: var(--color-muted);
    font-size: 0.8rem;
  ">Source: Author / Report / Date</p>
</div>
</body>
</html>
