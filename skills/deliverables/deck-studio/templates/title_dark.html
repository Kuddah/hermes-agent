<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280,height=720">
  <link rel="stylesheet" href="../_theme.css">
</head>
<body class="slide">
<div class="slide-wrapper" style="
  display:flex; flex-direction:column;
  justify-content:center; align-items:center; text-align:center;
  background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-surface) 100%);
  padding: 80px;
">
  <p style="
    color: var(--color-primary);
    font-family: var(--font-heading);
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin: 0 0 20px;
  ">ORGANIZATION NAME</p>

  <h1 style="
    color: var(--color-text);
    font-family: var(--font-heading);
    font-size: 3.5rem;
    font-weight: 700;
    line-height: 1.15;
    margin: 0 0 28px;
    max-width: 900px;
  ">Presentation Title Goes Here</h1>

  <p style="
    color: var(--color-muted);
    font-family: var(--font-body);
    font-size: 1.1rem;
    margin: 0 0 48px;
  ">Subtitle or tagline — one memorable sentence</p>

  <div style="
    display: flex; gap: 40px; align-items: center;
    color: var(--color-muted); font-size: 0.9rem;
  ">
    <span>Presenter Name</span>
    <span style="color:var(--color-primary);">·</span>
    <span>Month YYYY</span>
    <span style="color:var(--color-primary);">·</span>
    <span>Occasion / Audience</span>
  </div>
</div>
</body>
</html>
