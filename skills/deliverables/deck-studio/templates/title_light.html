<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280,height=720">
  <link rel="stylesheet" href="../_theme.css">
  <style>
    body { background: #ffffff; }
    .slide-wrapper { background: #ffffff; }
  </style>
</head>
<body class="slide">
<div class="slide-wrapper" style="
  display:flex; flex-direction:column;
  justify-content:center; padding: 80px 100px;
  background: #ffffff;
  border-left: 10px solid var(--color-primary);
">
  <p style="
    color: var(--color-primary);
    font-family: var(--font-heading);
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 0 0 20px;
  ">ORGANIZATION NAME</p>

  <h1 style="
    color: #1a1a2e;
    font-family: var(--font-heading);
    font-size: 3.2rem;
    font-weight: 700;
    line-height: 1.2;
    margin: 0 0 24px;
    max-width: 850px;
  ">Presentation Title Goes Here</h1>

  <p style="
    color: #555;
    font-family: var(--font-body);
    font-size: 1.1rem;
    margin: 0 0 48px;
    max-width: 700px;
  ">Subtitle or key message — one clear sentence</p>

  <div style="
    display: flex; gap: 32px; align-items: center;
    color: #888; font-size: 0.9rem;
  ">
    <span>Presenter Name</span>
    <span style="color:var(--color-primary);">·</span>
    <span>Month YYYY</span>
    <span style="color:var(--color-primary);">·</span>
    <span>Occasion / Audience</span>
  </div>
</div>
</body>
</html>
