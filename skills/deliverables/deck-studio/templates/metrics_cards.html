<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280,height=720">
  <link rel="stylesheet" href="../_theme.css">
</head>
<body class="slide">
<div class="slide-wrapper" style="
  display:flex; flex-direction:column;
  padding: 52px 70px;
  background: var(--color-bg);
">
  <h2 style="
    color: var(--color-primary);
    font-family: var(--font-heading);
    font-size: 1.9rem;
    font-weight: 700;
    margin: 0 0 36px;
  ">Key Metrics</h2>

  <!-- 3-metric layout — duplicate/remove cards as needed -->
  <div style="display:flex; gap:28px; flex:1;">

    <div style="
      flex:1; background:var(--color-surface); border-radius:12px;
      padding: 36px 32px;
      display:flex; flex-direction:column; justify-content:center;
      border-top: 4px solid var(--color-primary);
    ">
      <div style="
        color: var(--color-primary);
        font-family: var(--font-heading);
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 8px;
      ">$4.2M</div>
      <div style="
        color: var(--color-text);
        font-family: var(--font-body);
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 4px;
      ">Annual Recurring Revenue</div>
      <div style="
        color: var(--color-muted);
        font-family: var(--font-body);
        font-size: 0.85rem;
      ">+142% year-over-year</div>
    </div>

    <div style="
      flex:1; background:var(--color-surface); border-radius:12px;
      padding: 36px 32px;
      display:flex; flex-direction:column; justify-content:center;
      border-top: 4px solid var(--color-secondary);
    ">
      <div style="
        color: var(--color-secondary);
        font-family: var(--font-heading);
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 8px;
      ">12,400</div>
      <div style="
        color: var(--color-text);
        font-family: var(--font-body);
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 4px;
      ">Active Users</div>
      <div style="
        color: var(--color-muted);
        font-family: var(--font-body);
        font-size: 0.85rem;
      ">+88% quarter-over-quarter</div>
    </div>

    <div style="
      flex:1; background:var(--color-surface); border-radius:12px;
      padding: 36px 32px;
      display:flex; flex-direction:column; justify-content:center;
      border-top: 4px solid #e3b341;
    ">
      <div style="
        color: #e3b341;
        font-family: var(--font-heading);
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 8px;
      ">94%</div>
      <div style="
        color: var(--color-text);
        font-family: var(--font-body);
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 4px;
      ">Customer Retention</div>
      <div style="
        color: var(--color-muted);
        font-family: var(--font-body);
        font-size: 0.85rem;
      ">NPS score: 72 (industry avg: 42)</div>
    </div>

  </div>
</div>
</body>
</html>
